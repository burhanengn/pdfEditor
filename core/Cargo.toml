[workspace]
resolver = "2"
members = [
    "crates/gp-model",
    "crates/gp-geom",
    "crates/gp-text",
    "crates/gp-pdf",
    "crates/gp-engine",
    "bindings/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
